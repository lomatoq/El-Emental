name: Source Snapshot Temp

on:
  push:
    branches:
      - codex/earth-core-polish
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: elemental-source-temp
          path: |
            Assets/Elemental
            Packages
            ProjectSettings
          if-no-files-found: error
          retention-days: 1
          compression-level: 9
