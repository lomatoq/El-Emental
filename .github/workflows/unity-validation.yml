name: Unity validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  source-snapshot-temp:
    name: Source snapshot temp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/upload-artifact@v4
        with:
          name: elemental-source-temp
          path: |
            Assets/Elemental
            Packages
            ProjectSettings
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  patch-rescue-temp:
    name: Patch rescue temp
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/earth-core-polish
          fetch-depth: 0
      - name: Patch rescue files
        shell: python
        run: |
          from pathlib import Path

          shader_path = Path("Assets/Elemental/Content/Shaders/EarthTriplanar.shader")
          shader = shader_path.read_text(encoding="utf-8")
          if "_EarthSeismicVision" not in shader:
              global_anchor = "            half _ElementalNight01;\n"
              global_replacement = """            half _ElementalNight01;

            // Grounded seismic perception is driven globally by EarthSeismicVision.
            // Keeping it outside UnityPerMaterial lets terrain, walls and loose matter
            // share one causal pulse without cloning material instances.
            half _EarthSeismicVision;
            float4 _EarthSeismicOrigin;
            float _EarthSeismicRadius;
"""
              color_anchor = """                half magicEmission = lerp(0.18h, 0.54h, saturate(_ElementalNight01));
                half3 color = albedo * (ambient + direct + additional) +
                              (mainLight.color * specular) + _EmissionColor.rgb +
                              (_MagicColor.rgb * magicMask * magicEmission);
"""
              color_replacement = """                half magicEmission = lerp(0.18h, 0.54h, saturate(_ElementalNight01));
                float seismicDistance = distance(input.positionWS, _EarthSeismicOrigin.xyz);
                float seismicDelta = abs(seismicDistance - max(0.001, _EarthSeismicRadius));
                half seismicRing = (1.0h - smoothstep(0.10h, 0.62h, seismicDelta)) *
                                   saturate(_EarthSeismicVision);
                half seismicInterior = saturate(1.0h - seismicDistance /
                    max(0.001h, _EarthSeismicRadius)) * 0.055h * saturate(_EarthSeismicVision);
                half3 seismicEmission = half3(0.055h, 0.78h, 1.48h) *
                                        (seismicRing * 1.16h + seismicInterior);
                half3 color = albedo * (ambient + direct + additional) +
                              (mainLight.color * specular) + _EmissionColor.rgb +
                              (_MagicColor.rgb * magicMask * magicEmission) + seismicEmission;
"""
              if global_anchor not in shader or color_anchor not in shader:
                  raise SystemExit("Earth shader anchors not found")
              shader = shader.replace(global_anchor, global_replacement, 1)
              shader = shader.replace(color_anchor, color_replacement, 1)
              shader_path.write_text(shader, encoding="utf-8", newline="\n")

          runtime_path = Path("Assets/Elemental/Runtime/Characters/EarthRuntimeRescueSystems.cs")
          runtime = runtime_path.read_text(encoding="utf-8")
          armor_old = """            int count = _armor.CopyActivePiecesNonAlloc(_pieces);
            Vector3 center = _animator.transform.position;
            for (int index = 0; index < count; index++)
            {
                EarthArmorPiece piece = _pieces[index];
                if (piece == null || piece.IsReleased || !piece.gameObject.activeInHierarchy) continue;
                int slot = FindAnchorSlot(piece);
                if (slot < 0 || _anchors[slot].Valid) continue;
                if ((piece.transform.position - center).sqrMagnitude > 4.5f) continue;
                Transform bone = FindNearestBone(piece.transform.position);
                if (bone == null) continue;
                _anchors[slot] = new BoneAnchor
                {
                    Piece = piece,
                    Bone = bone,
                    LocalPosition = bone.InverseTransformPoint(piece.transform.position),
                    LocalRotation = Quaternion.Inverse(bone.rotation) * piece.transform.rotation,
                    Valid = true
                };
"""
          armor_new = """            int count = _armor.CopyActivePiecesNonAlloc(_pieces);
            for (int index = 0; index < count; index++)
            {
                EarthArmorPiece piece = _pieces[index];
                if (piece == null || piece.IsReleased || !piece.gameObject.activeInHierarchy) continue;
                int slot = FindAnchorSlot(piece);
                if (slot < 0 || _anchors[slot].Valid) continue;
                Transform bone = FindNearestBone(piece.transform.position);
                if (bone == null) continue;
                Vector3 boneOffset = piece.transform.position - bone.position;
                // Do not freeze a plate while it is still visibly flying toward the
                // body. Once it enters the attachment envelope, clamp any remaining
                // spring debt so compact armor sits on the body instead of behind it.
                if (boneOffset.sqrMagnitude > 0.62f * 0.62f) continue;
                Vector3 localPosition = bone.InverseTransformPoint(piece.transform.position);
                localPosition = Vector3.ClampMagnitude(localPosition, 0.42f);
                _anchors[slot] = new BoneAnchor
                {
                    Piece = piece,
                    Bone = bone,
                    LocalPosition = localPosition,
                    LocalRotation = Quaternion.Inverse(bone.rotation) * piece.transform.rotation,
                    Valid = true
                };
"""
          if armor_old in runtime:
              runtime = runtime.replace(armor_old, armor_new, 1)
              runtime_path.write_text(runtime, encoding="utf-8", newline="\n")
          elif "spring debt so compact armor sits on the body" not in runtime:
              raise SystemExit("Armor attachment anchor not found")
      - name: Commit rescue patch
        run: |
          if git diff --quiet -- Assets/Elemental/Content/Shaders/EarthTriplanar.shader Assets/Elemental/Runtime/Characters/EarthRuntimeRescueSystems.cs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Assets/Elemental/Content/Shaders/EarthTriplanar.shader Assets/Elemental/Runtime/Characters/EarthRuntimeRescueSystems.cs
          git commit -m "Tighten seismic and compact armor rescue"
          git push origin HEAD:codex/earth-core-polish

  tests:
    name: ${{ matrix.os }} / tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/**', 'ProjectSettings/**', 'Assets/**') }}
      - name: EditMode
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.7f1
          testMode: EditMode
          artifactsPath: TestResults/EditMode
      - name: PlayMode
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.7f1
          testMode: PlayMode
          artifactsPath: TestResults/PlayMode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ runner.os }}
          path: TestResults

  platform-build:
    name: ${{ matrix.target }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: StandaloneWindows64
          - os: macos-latest
            target: StandaloneOSX
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.7f1
          targetPlatform: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: build
