name: Unity validation

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  source-snapshot-final-temp:
    name: Source snapshot final temp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/upload-artifact@v4
        with:
          name: elemental-source-final-temp
          path: |
            Assets/Elemental
            Packages
            ProjectSettings
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  tests:
    name: ${{ matrix.os }} / tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ runner.os }}-${{ hashFiles('Packages/**', 'ProjectSettings/**', 'Assets/**') }}
      - name: EditMode
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.7f1
          testMode: EditMode
          artifactsPath: TestResults/EditMode
      - name: PlayMode
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.7f1
          testMode: PlayMode
          artifactsPath: TestResults/PlayMode
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ runner.os }}
          path: TestResults

  platform-build:
    name: ${{ matrix.target }} build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: StandaloneWindows64
          - os: macos-latest
            target: StandaloneOSX
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.5.7f1
          targetPlatform: ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: build
