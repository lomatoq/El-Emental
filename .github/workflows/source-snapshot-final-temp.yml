name: Source Snapshot Final Temp

on:
  push:
    branches:
      - codex/earth-core-polish

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/upload-artifact@v4
        with:
          name: elemental-source-final-temp
          path: |
            Assets/Elemental
            Packages
            ProjectSettings
          if-no-files-found: error
          retention-days: 1
          compression-level: 9

  patch-camera:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/earth-core-polish
          fetch-depth: 0
      - name: Make charge camera feedback SRP-safe
        shell: python
        run: |
          from pathlib import Path

          path = Path("Assets/Elemental/Presentation/VFX/EarthPresentationRescueSystems.cs")
          text = path.read_text(encoding="utf-8")
          if "HandleBeginCameraRendering" in text and "_lastAppliedFov" in text:
              print("Camera rescue patch already present")
              raise SystemExit(0)

          text = text.replace(
              """        private float _lastFovOffset;
        private Vector3 _renderPosition;
""",
              """        private float _lastFovOffset;
        private float _baseFov;
        private float _lastAppliedFov;
        private bool _hasAppliedFov;
        private Vector3 _renderPosition;
""",
              1)

          text = text.replace(
              """        private void Awake()
        {
            _camera = GetComponent<Camera>();
            BuildVolume();
            ResolveInput();
        }

        private void OnDestroy()
        {
            if (_volume != null && _volume.sharedProfile != null)
                Destroy(_volume.sharedProfile);
        }
""",
              """        private void Awake()
        {
            _camera = GetComponent<Camera>();
            _baseFov = _camera != null ? _camera.fieldOfView : 60f;
            _lastAppliedFov = _baseFov;
            BuildVolume();
            ResolveInput();
        }

        private void OnEnable()
        {
            RenderPipelineManager.beginCameraRendering += HandleBeginCameraRendering;
            RenderPipelineManager.endCameraRendering += HandleEndCameraRendering;
        }

        private void OnDisable()
        {
            RenderPipelineManager.beginCameraRendering -= HandleBeginCameraRendering;
            RenderPipelineManager.endCameraRendering -= HandleEndCameraRendering;
            RestoreRenderPose();
            RestoreBaseFov();
        }

        private void OnDestroy()
        {
            RenderPipelineManager.beginCameraRendering -= HandleBeginCameraRendering;
            RenderPipelineManager.endCameraRendering -= HandleEndCameraRendering;
            RestoreRenderPose();
            RestoreBaseFov();
            if (_volume != null && _volume.sharedProfile != null)
                Destroy(_volume.sharedProfile);
        }
""",
              1)

          text = text.replace(
              """            float baseFov = Mathf.Clamp(_camera.fieldOfView - _lastFovOffset, 25f, 110f);
            _lastFovOffset = Mathf.Lerp(0f, 6.5f, EaseOut(_charge));
            _camera.fieldOfView = Mathf.Clamp(baseFov + _lastFovOffset, 25f, 115f);
""",
              """            float observedFov = _camera.fieldOfView;
            if (!_hasAppliedFov || Mathf.Abs(observedFov - _lastAppliedFov) > 0.05f)
                _baseFov = Mathf.Clamp(observedFov, 25f, 110f);
            _lastFovOffset = Mathf.Lerp(0f, 6.5f, EaseOut(_charge));
            _lastAppliedFov = Mathf.Clamp(_baseFov + _lastFovOffset, 25f, 115f);
            _camera.fieldOfView = _lastAppliedFov;
            _hasAppliedFov = true;
""",
              1)

          text = text.replace(
              """        private void OnPreCull()
        {
            if (_camera == null || _charge <= 0.001f || _renderPoseSaved) return;
            _renderPoseSaved = true;
            _renderPosition = transform.position;
            _renderRotation = transform.rotation;
            float time = Time.unscaledTime * Mathf.Lerp(18f, 31f, _charge);
            float x = Mathf.PerlinNoise(time, 13.7f) * 2f - 1f;
            float y = Mathf.PerlinNoise(7.3f, time * 1.07f) * 2f - 1f;
            float z = Mathf.PerlinNoise(time * 0.83f, 27.1f) * 2f - 1f;
            float positionAmplitude = Mathf.Lerp(0f, 0.0065f, _charge * _charge);
            float rotationAmplitude = Mathf.Lerp(0f, 0.14f, _charge * _charge);
            transform.position += transform.right * x * positionAmplitude +
                                  transform.up * y * positionAmplitude;
            transform.rotation = Quaternion.Euler(y * rotationAmplitude, x * rotationAmplitude, z * rotationAmplitude * 0.45f) *
                                 transform.rotation;
        }

        private void OnPostRender()
        {
            if (!_renderPoseSaved) return;
            transform.SetPositionAndRotation(_renderPosition, _renderRotation);
            _renderPoseSaved = false;
        }
""",
              """        private void HandleBeginCameraRendering(ScriptableRenderContext context, Camera renderingCamera)
        {
            if (renderingCamera != _camera || _camera == null ||
                _charge <= 0.001f || _renderPoseSaved)
                return;
            _renderPoseSaved = true;
            _renderPosition = transform.position;
            _renderRotation = transform.rotation;
            float time = Time.unscaledTime * Mathf.Lerp(18f, 31f, _charge);
            float x = Mathf.PerlinNoise(time, 13.7f) * 2f - 1f;
            float y = Mathf.PerlinNoise(7.3f, time * 1.07f) * 2f - 1f;
            float z = Mathf.PerlinNoise(time * 0.83f, 27.1f) * 2f - 1f;
            float positionAmplitude = Mathf.Lerp(0f, 0.0065f, _charge * _charge);
            float rotationAmplitude = Mathf.Lerp(0f, 0.14f, _charge * _charge);
            transform.position += transform.right * x * positionAmplitude +
                                  transform.up * y * positionAmplitude;
            transform.rotation = Quaternion.Euler(
                                     y * rotationAmplitude,
                                     x * rotationAmplitude,
                                     z * rotationAmplitude * 0.45f) *
                                 transform.rotation;
        }

        private void HandleEndCameraRendering(ScriptableRenderContext context, Camera renderingCamera)
        {
            if (renderingCamera == _camera) RestoreRenderPose();
        }

        private void RestoreRenderPose()
        {
            if (!_renderPoseSaved) return;
            transform.SetPositionAndRotation(_renderPosition, _renderRotation);
            _renderPoseSaved = false;
        }

        private void RestoreBaseFov()
        {
            if (_camera != null && _hasAppliedFov)
                _camera.fieldOfView = _baseFov;
            _hasAppliedFov = false;
            _lastFovOffset = 0f;
        }
""",
              1)

          text = text.replace(
              """            if (_input != null)
            {
                Vector3 target = _input.BendTargetPosition;
""",
              """            if (_input != null && _charge > 0.02f)
            {
                Vector3 target = _input.BendTargetPosition;
""",
              1)

          required = (
              "HandleBeginCameraRendering",
              "HandleEndCameraRendering",
              "RestoreBaseFov",
              "_lastAppliedFov",
              "_charge > 0.02f")
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"Camera patch anchors failed: {missing}")
          path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit camera rescue patch
        run: |
          if git diff --quiet -- Assets/Elemental/Presentation/VFX/EarthPresentationRescueSystems.cs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Assets/Elemental/Presentation/VFX/EarthPresentationRescueSystems.cs
          git commit -m "Make charge camera feedback SRP-safe"
          git push origin HEAD:codex/earth-core-polish
