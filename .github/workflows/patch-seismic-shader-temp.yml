name: Patch Seismic Shader Temp

on:
  push:
    branches:
      - codex/earth-core-polish

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/earth-core-polish
          fetch-depth: 0
      - name: Patch Earth shader
        shell: python
        run: |
          from pathlib import Path

          path = Path("Assets/Elemental/Content/Shaders/EarthTriplanar.shader")
          text = path.read_text(encoding="utf-8")
          if "_EarthSeismicVision" in text:
              print("Seismic shader patch already present")
              raise SystemExit(0)

          globals_anchor = """            half _ElementalNight01;\n"""
          globals_replacement = """            half _ElementalNight01;\n\n            // Grounded seismic perception is driven globally by EarthSeismicVision.\n            // Keeping it outside UnityPerMaterial lets terrain, walls and loose matter\n            // share one causal pulse without cloning material instances.\n            half _EarthSeismicVision;\n            float4 _EarthSeismicOrigin;\n            float _EarthSeismicRadius;\n"""
          if globals_anchor not in text:
              raise SystemExit("Global shader anchor not found")
          text = text.replace(globals_anchor, globals_replacement, 1)

          color_anchor = """                half magicEmission = lerp(0.18h, 0.54h, saturate(_ElementalNight01));\n                half3 color = albedo * (ambient + direct + additional) +\n                              (mainLight.color * specular) + _EmissionColor.rgb +\n                              (_MagicColor.rgb * magicMask * magicEmission);\n"""
          color_replacement = """                half magicEmission = lerp(0.18h, 0.54h, saturate(_ElementalNight01));\n                float seismicDistance = distance(input.positionWS, _EarthSeismicOrigin.xyz);\n                float seismicDelta = abs(seismicDistance - max(0.001, _EarthSeismicRadius));\n                half seismicRing = (1.0h - smoothstep(0.10h, 0.62h, seismicDelta)) *\n                                   saturate(_EarthSeismicVision);\n                half seismicInterior = saturate(1.0h - seismicDistance /\n                    max(0.001h, _EarthSeismicRadius)) * 0.055h * saturate(_EarthSeismicVision);\n                half3 seismicEmission = half3(0.055h, 0.78h, 1.48h) *\n                                        (seismicRing * 1.16h + seismicInterior);\n                half3 color = albedo * (ambient + direct + additional) +\n                              (mainLight.color * specular) + _EmissionColor.rgb +\n                              (_MagicColor.rgb * magicMask * magicEmission) + seismicEmission;\n"""
          if color_anchor not in text:
              raise SystemExit("Fragment color anchor not found")
          text = text.replace(color_anchor, color_replacement, 1)
          path.write_text(text, encoding="utf-8", newline="\n")
      - name: Commit patch
        run: |
          if git diff --quiet -- Assets/Elemental/Content/Shaders/EarthTriplanar.shader; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- Assets/Elemental/Content/Shaders/EarthTriplanar.shader
          git commit -m "Add seismic pulse emission to earth shader"
          git push origin HEAD:codex/earth-core-polish
